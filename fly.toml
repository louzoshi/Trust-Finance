# Fly.io. HTTPS and the certificate are handled by the platform; the app only speaks
# HTTP on 8080 behind it.
app = "trust-finance-demo"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  # The public demo: signs every visitor in as one local account and fills an empty
  # database with a year of plausible finances. Never set these on a real install.
  Auth__Bypass = "true"
  Demo__Enabled = "true"

  # Fly terminates TLS and forwards the request over plain HTTP on the internal network.
  # Without this the app reads every request as http and every visitor as the proxy, which
  # would make the sign-in throttle count the whole internet as one host.
  Hosting__BehindProxy = "true"

[http_service]
  internal_port = 8080
  force_https = true

  # Blazor Server holds a SignalR circuit per visitor, so a machine that stopped would
  # drop every open page. One machine, always on, is both cheaper and steadier here.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # /health opens the database and reads a row, so a machine whose migrations failed is
  # never sent traffic. Anonymous by design: a probe has no session.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
