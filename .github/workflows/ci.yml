name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Trust-Finance.sln

      # `dotnet list package --vulnerable` always exits 0, so the report has to be
      # inspected: any "vulnerable packages" line fails the build.
      - name: Vulnerable package scan
        run: |
          dotnet list Trust-Finance.sln package --vulnerable --include-transitive \
            | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Build
        run: dotnet build Trust-Finance.sln --configuration Release --no-restore

      # The suite runs the real migrations against in-memory SQLite, so it needs
      # no database service and no container.
      - name: Unit tests
        run: >
          dotnet test Trust-Finance.Tests/Trust-Finance.Tests.csproj
          --configuration Release --no-build --verbosity normal

      # Boots the app in-process and drives it over HTTP. The brapi.dev calls are
      # excluded: a rate limit or an outage there is not a regression here.
      - name: Integration tests
        run: >
          dotnet test Trust-Finance.IntegrationTests/Trust-Finance.IntegrationTests.csproj
          --configuration Release --no-build --verbosity normal
          --filter "Category!=Network"

      # The E2E suite launches the built app as a process and drives it with a real
      # Chromium, which the Playwright package downloads on demand.
      - name: Install Playwright browser
        run: >
          pwsh Trust-Finance.E2ETests/bin/Release/net10.0/playwright.ps1
          install --with-deps chromium

      - name: End-to-end tests
        run: >
          dotnet test Trust-Finance.E2ETests/Trust-Finance.E2ETests.csproj
          --configuration Release --no-build --verbosity normal
