services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trustfinance-sql
    environment:
      ACCEPT_EULA: "Y"
      # Set in .env, which is gitignored. See .env.example.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # The image ships sqlcmd under mssql-tools18, and that build rejects the
      # container's self-signed certificate without -C.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      retries: 5
      start_period: 30s

volumes:
  sqlserver_data:
